;Avalonium runtime configuration

InGameGUI=false
;Enable/Disable InGame Overlay

UnrealEngineConsole=false
;Disable/Enable Unreal Engine Console

UseWndProcHook=false
;Enable if you're experiencing crashes when unreal engine console is enabled

DumpAllDeveloperCommands=false
;Dump all developer commands

EnableLuaMods=false
;Enable Lua scripting and mod loader runtime

LuaModsPath=
;Custom path for Lua mods folder (leave empty for default)

EnableCppMods=false
;Enable native C++ mods

CppModsPath=
;Custom path for C++ mods folder (leave empty for default)

SDKValidation=false
;Run the advanced SDK validation

VerboseLog=false
;Enable verbose logging for diagnostics

SDKPath=
;Folder containing SDKMetadata.json for validation

GenerateBuildSystem=false
;Automatically run GenerateBuild.py after dumping the SDK

InitDelayMinutes=0
;Set Initialization Delay in minutes

InitDelaySeconds=0
;Set Initialization Delay in seconds

AutoDiscoverAESKey=false
;Auto-discover and verify AES-256 encryption key from live memory at startup.

SkipPatternScan=false
EnableDiscoveryCache=false
SDKLibclangGeneration=false
LibclangPath=

[AggressiveDog]
;External crash watchdog for Avalonium. When enabled, Avalonium launches
;CrashHandler\AggressiveDog.exe beside Avalonium.dll to monitor this process.
;It records crash details for diagnosis; it does not prevent or fix a crash.
;A successful normal exit does not create a crash report.
Enabled=false
;Folder for watchdog text reports, status log, and optional minidumps.
LogDirectory=CrashHandler/Crashes
;Include the faulting thread's CPU registers in the text report.
DumpRegisters=true
;Capture Windows fast-fail events in addition to standard fatal exceptions.
CatchFastFail=true
;Arm a hardware breakpoint on NtTerminateProcess so abnormal terminations are caught.
;Disable when a protected game treats debug registers as tampering.
TerminationBreakpoint=true
;Attach as a debugger for exception-level crash reports. Off by default because
;protected games can treat an attached debugger as tampering and terminate.
AttachDebugger=false
;Maximum call-stack frames for the faulting thread (1-256).
MaxStackDepth=64
;Maximum stack frames per other thread (0-64; 0 disables them).
OtherThreadStackDepth=8
;Write a minidump alongside the text report (can use substantial disk space).
WriteMiniDump=true
