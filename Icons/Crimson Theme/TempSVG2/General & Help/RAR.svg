<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 256" fill="none" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="crimsonAccent" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000000"/>
    <stop offset="0.5" stop-color="#000000"/>
    <stop offset="1" stop-color="#570000"/>
  </linearGradient>
  <linearGradient id="crimsonMain" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="256">
    <stop offset="0" stop-color="#000000"/>
    <stop offset="0.45" stop-color="#ff0000"/>
    <stop offset="0.6" stop-color="#b30000"/>
